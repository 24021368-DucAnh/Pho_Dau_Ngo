name: Godot spike smoke tests

on:
  push:
    branches:
      - spike/godot4-m0
    paths:
      - "godot_spike/**"
      - ".github/workflows/godot-spike.yml"
  pull_request:
    paths:
      - "godot_spike/**"
      - ".github/workflows/godot-spike.yml"

jobs:
  smoke-test:
    name: Import project and run interaction contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Godot 4
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false

      - name: Import and parse project
        run: godot --headless --editor --path godot_spike --quit

      - name: Run interaction contract tests
        working-directory: godot_spike
        run: godot --headless --path . --script res://tests/test_interaction_contract.gd
